<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- ============================================
     HEADER UNIFICADO - Se adapta según el rol
     ============================================ -->

<!-- HEADER PARA ADMINISTRADOR -->
<header th:fragment="header" sec:authorize="hasRole('ADMIN')">
    <div class="contenedor" id="headerup">
        <a th:href="@{/main}" class="logo">
            <img th:src="@{/img/AdoptPets (1).png}" alt="logo de la pagina">
        </a>
        <nav>
            <div class="user-menu">
                <button class="user-button" type="button">
                    <span sec:authentication="principal.nombre">Admin</span>
                </button>

                <div class="user-dropdown">
                    <form th:action="@{/logout}" method="post">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />
                        <button type="submit" class="logout-btn">
                            Cerrar sesión
                        </button>
                    </form>
                </div>
            </div>
        </nav>
    </div>

    <!-- Barra de navegación admin -->
    <div class="headadmin" id="headadmin">
        <nav>
            <a th:href="@{/main}">Ir al sitio</a>
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <a th:href="@{/admin/mascotas}">Mascotas</a>
            <a th:href="@{/admin/adopciones}">Adopciones</a>
            <a th:href="@{/admin/refugios}">Refugios</a>
            <a th:href="@{/admin/usuarios}">Usuarios</a>
            <a th:href="@{/admin/reportes}">Reportes</a>
        </nav>
    </div>

    <div id="header-spacer"></div>
</header>

<!-- HEADER PARA REFUGIO -->
<header th:fragment="header" sec:authorize="hasRole('REFUGIO') and !hasRole('ADMIN')">

    <div class="contenedor" id="headerup">
        <a th:href="@{/main}" class="logo">
            <img th:src="@{/img/AdoptPets (1).png}" alt="logo de la pagina">
        </a>
        <nav>
            <div class="user-menu">
                <button class="user-button" type="button">
                    <span sec:authentication="principal.nombre">Refugio</span>
                </button>

                <div class="user-dropdown">
                    <a th:href="@{/refugio/perfil}" class="dropdown-link" style="display:block; padding: 10px 20px; color: #333; text-decoration: none;">
                        Configurar Refugio
                    </a>

                    <form th:action="@{/logout}" method="post">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />
                        <button type="submit" class="logout-btn">
                            Cerrar sesión
                        </button>
                    </form>
                </div>
            </div>
        </nav>
    </div>

    <div class="headadmin" id="headrefugio">
        <nav>
            <a th:href="@{/main}">Ir al sitio</a>
            <a th:href="@{/refugio/dashboard}">Dashboard</a>
            <a th:href="@{/refugio/mascotas}">Mis Mascotas</a>
            <a th:href="@{/refugio/adopciones}">Solicitudes</a>
            <a th:href="@{/contactenos}">Contáctanos</a>
        </nav>
    </div>

    <div id="header-spacer"></div>
</header>

<header th:fragment="header"
        sec:authorize="!hasRole('ADMIN') and !hasRole('REFUGIO')">

    <div class="contenedor">
        <a th:href="@{/main}" class="logo">
            <img th:src="@{/img/AdoptPets (1).png}" alt="logo de la pagina">
        </a>

        <nav>
            <a th:href="@{/adoptante/mascotas}">Mascotas</a>
            <a th:href="@{/refugios}">Refugios</a>
            <a th:href="@{/contactenos}">Contáctanos</a>

            <!-- VISITANTE -->
            <a sec:authorize="!isAuthenticated()"
               th:href="@{/login}"
               class="boton">
                Iniciar sesión
            </a>

            <!-- ADOPTANTE LOGUEADO -->
            <div sec:authorize="hasRole('ADOPTANTE')" class="user-menu">
                <button class="user-button" type="button">
                    <span sec:authentication="principal.nombre">Usuario</span>
                </button>

                <div class="user-dropdown">
                    <a th:href="@{/adoptante/perfil}" class="dropdown-link">
                        Mi perfil
                    </a>

                    <form th:action="@{/logout}" method="post">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />
                        <button type="submit" class="logout-btn">
                            Cerrar sesión
                        </button>
                    </form>
                </div>
            </div>
        </nav>
    </div>
</header>


</body>
</html>
